<div class="bonde-section-wrapper" data-live-section="testimonials">

<section class="bonde-section color-scheme-1 bonde-testimonials" style="--bonde-pt: 88px; --bonde-pb: 88px; --bonde-pt-m: 88px; --bonde-pb-m: 40px;">
  <div class="bonde-inner">
    <div class="bonde-testimonials__head">
      <div class="left">
        <span class="bonde-eyebrow"><span class="bonde-eyebrow__slash">//</span>TESTIMONIALS</span>
        <h2 class="bonde-h2">Real result, real feedback</h2>
      </div>

      <div class="bonde-testimonials__arrows" role="group" aria-label="Testimonial pagination">
        <button class="bonde-testimonials__arrow bonde-testimonials__arrow--prev" type="button" aria-label="Previous" data-bonde-prev>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="bonde-testimonials__arrow" type="button" aria-label="Next" data-bonde-next>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="bonde-testimonials__viewport">
    <div class="bonde-testimonials__track" data-bonde-track>
      
        
          <figure class="bonde-testimonial" >
            <div class="bonde-testimonial__person">
              <div class="bonde-testimonial__photo">
                
                  <img src="/site/jf-testimonial.png" alt="Johnny Fairways" width="608" height="800" loading="lazy">
                
              </div>
              <figcaption class="bonde-testimonial__name">Johnny Fairways</figcaption>
            </div>
            <blockquote class="bonde-testimonial__quote">
              
              <p>&ldquo;We needed a way to sell 3-packs of the same shirt in different colors, and this app nails it. Their team came and set up the bundles for us within the day of installation. UI looks clean. Highly recommend.&rdquo;</p>
            </blockquote>
          </figure>
        
      
        
          <figure class="bonde-testimonial" >
            <div class="bonde-testimonial__person">
              <div class="bonde-testimonial__photo">
                
                  <img src="/site/western-welder-testimonial.png" alt="Western Welder Outfitting" width="608" height="950" loading="lazy">
                
              </div>
              <figcaption class="bonde-testimonial__name">Western Welder Outfitting</figcaption>
            </div>
            <blockquote class="bonde-testimonial__quote">
              
              <p>&ldquo;This software works great, it helped us manage our inventory much better and cleaned up our backend.&rdquo;</p>
            </blockquote>
          </figure>
        
      
    </div>
  </div>
</section>




</div>
