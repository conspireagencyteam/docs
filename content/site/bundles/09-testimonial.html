<div class="bonde-section-wrapper" data-live-section="testimonial">


<section
  class="bonde-section color-scheme-1 bonde-btestim"
  style="--bonde-pt: 88px; --bonde-pb: 88px; --bonde-pt-m: 64px; --bonde-pb-m: 64px;"
>
  <div class="bonde-inner">
    <div class="bonde-btestim__head">
      
        <span class="bonde-eyebrow"><span class="bonde-eyebrow__slash">//</span>FROM OUR MERCHANTS</span>
      
      <h2 class="bonde-h2 bonde-btestim__title">Real stores, real bundle results.</h2>
    </div>

    <div class="bonde-btestim__card">
      <figure class="bonde-btestim__quote">
        <span class="bonde-btestim__mark" aria-hidden="true">&ldquo;</span>
        <blockquote class="bonde-btestim__body">We needed a way to sell 3-packs of the same shirt in different colors, and this app nails it. Their team came and set up the bundles for us within the day of installation. UI looks clean. Highly recommend.</blockquote>
        <figcaption class="bonde-btestim__person">
          <div class="bonde-btestim__avatar">
            
          </div>
          <div class="bonde-btestim__who">
            <span class="bonde-btestim__name">Johnny Fairways</span>
            <span class="bonde-btestim__role">Shopify App Store review</span>
          </div>
        </figcaption>
      </figure>

      <aside class="bonde-btestim__results">
        <span class="bonde-btestim__results-kicker">THE RESULTS</span>
        
          
            <div class="bonde-btestim__stat" >
              <span class="bonde-btestim__stat-value">+34%</span>
              <span class="bonde-btestim__stat-label">AOV in 72 hours</span>
            </div>
          
        
          
            <div class="bonde-btestim__stat" >
              <span class="bonde-btestim__stat-value">2.1×</span>
              <span class="bonde-btestim__stat-label">Units shipped week over week</span>
            </div>
          
        
          
            <div class="bonde-btestim__stat" >
              <span class="bonde-btestim__stat-value">4.2%</span>
              <span class="bonde-btestim__stat-label">Bundle conversion rate</span>
            </div>
          
        
      </aside>
    </div>
  </div>
</section>


</div>
